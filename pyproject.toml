[project]
name = "horizon"
version = "1.0.0"
description = "Horizon Exoplanet Detection & Characterization Platform"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "python-multipart==0.0.9",
    "websockets==12.0",
    "httpx==0.27.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite==0.20.0",
    "alembic==1.13.1",
    "redis[asyncio]==5.0.4",
    "pydantic",
    "pydantic-settings",
    "python-dotenv==1.0.1",
    "numpy",
    "aiofiles==23.2.1",
    "anyio==4.4.0",
    "structlog==24.2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/ml_models/*", "tests/*"]
